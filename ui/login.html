<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>登录 · QQ Agent</title><link rel="stylesheet" href="/platform.css"><script type="module" src="/platform.js"></script></head>
<body data-page="login"><main class="auth-layout"><section class="auth-intro"><a class="brand" href="/">QQ Agent<span>聊天管理</span></a><h1>让每个聊天，<br>保留自己的性格。</h1><p>给不同的群和私聊选择人设，继续原来的对话，也看清每一笔模型花费。</p><a href="/help.html">第一次使用？看看使用帮助</a></section><section class="auth-panel" aria-labelledby="auth-title"><div class="auth-tabs" role="tablist" aria-label="账号操作"><button type="button" id="login-tab" role="tab" aria-selected="true">登录账号</button><button type="button" id="register-tab" role="tab" aria-selected="false" disabled>注册账号</button></div><h2 id="auth-title">欢迎回来</h2><p id="auth-note" class="muted">使用你的账号和密码登录。</p><form id="auth-form"><label for="username">账号</label><input id="username" name="username" autocomplete="username" maxlength="100" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><div id="confirm-field" hidden><label for="confirm-password">再次输入密码</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password"></div><button class="primary full" type="submit" id="auth-submit">登录</button><p id="auth-status" class="form-status" role="status" aria-live="polite">正在连接账号服务…</p></form><p class="small muted">注册后可以管理本人私聊。管理群聊前，需要验证你在群内的管理权限。</p><button type="button" class="quiet" data-action="theme">切换浅色 / 深色</button></section></main></body></html>
